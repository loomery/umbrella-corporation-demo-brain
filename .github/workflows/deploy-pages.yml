# Builds the brain-site static frontend and deploys it to GitHub Pages.
#
# This is the public-facing demo site for this project brain — a Quartz-based wiki
# and dashboard rendered from docs/*.md via the @loomery/brain-site package.

name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Use HTTPS for github: dependencies"
        # npm's `github:owner/repo` shorthand shells out to `git ls-remote` over
        # SSH by default, and this runner has no SSH key. loomery/brain-site is
        # public, so a plain anonymous https:// rewrite is enough — no token
        # needed.
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npx brain-site build

      - name: Rewrite root-absolute asset paths for the Pages subpath
        # Quartz (as vendored by @loomery/brain-site) emits every internal
        # asset reference — href/src attributes, CSS url(), the inline
        # contentIndex.json fetch — as root-absolute ("/index.css", not
        # "index.css"). That only resolves correctly when the site is served
        # from a domain root. A GitHub Pages *project* site (no custom domain)
        # is served from /<repo-name>/ instead, so every asset 404s unless
        # those paths are rewritten to include that prefix. Quartz's own
        # `baseUrl` config option does NOT do this — confirmed by reading
        # quartz/util/path.ts, it's declared but never consumed for path
        # generation — so this has to happen as a post-build text rewrite.
        # Scoped to exactly the patterns Quartz/brain-site emit (verified
        # against this repo's own real 404s), and guarded against ever
        # touching a protocol-relative "//host/..." URL.
        #
        # Known gap: any client-side JS that constructs a URL from data at
        # runtime (e.g. a search result or graph-node click building
        # `/<slug>` from contentIndex.json) is NOT reachable by a text
        # rewrite and may still 404. Page load, styling, and the search
        # index fetch itself are what this fixes.
        #
        # Double-prefix guard: @loomery/brain-site >= 1.5.0's `baseUrl` key
        # (set in brain-site.yaml) makes the onboarding emitter's own hrefs
        # and Mermaid `click` targets already-prefixed at the source — see
        # loomery/brain-site#4. This rewrite must not re-prefix those, or
        # they'd end up double-prefixed. Guarded with a negative lookahead so
        # a path already starting with the prefix is left alone.
        # A prior version of this step used `node -e '...'` with the script
        # inline in a bash single-quoted string. An apostrophe in one of the
        # script's own comments ("the 404 pages own link") silently closed
        # that string early and broke the whole step with a bash syntax
        # error — a heredoc with a quoted delimiter ('EOF', not EOF) doesn't
        # have this failure mode: bash treats everything up to the literal
        # EOF line as opaque text, no escaping of quotes/apostrophes/$ needed.
        env:
          PAGES_PATH_PREFIX: /umbrella-corporation-demo-brain
        run: |
          cat > /tmp/rewrite-paths.cjs <<'EOF'
          const fs = require("fs");
          const path = require("path");
          const prefix = process.env.PAGES_PATH_PREFIX;
          const prefixBody = prefix.replace(/^\//, "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          // (\/|$) also matches the bare prefix with nothing after it (e.g.
          // the built-in 404 pages own cfg.baseUrl-derived "Return to
          // Homepage" link), not just a path that continues with "/segment".
          const alreadyPrefixed = new RegExp("^" + prefixBody + "(/|$)");
          const root = ".brain-site/public";
          const exts = new Set([".html", ".css", ".js", ".json", ".xml"]);
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(p);
              else if (exts.has(path.extname(entry.name))) rewrite(p);
            }
          }
          function rewriteMatch(rest) {
            return alreadyPrefixed.test(rest) ? "/" + rest : prefix + "/" + rest;
          }
          function rewrite(file) {
            const before = fs.readFileSync(file, "utf8");
            const after = before
              .replace(/((?:href|src|action)=["\x27])\/(?!\/)([^"\x27]*)/g, (_, p1, rest) => p1 + rewriteMatch(rest))
              .replace(/(url\((?:["\x27])?)\/(?!\/)([^)"\x27]*)/g, (_, p1, rest) => p1 + rewriteMatch(rest))
              .replace(/(fetch\((?:["\x27]))\/(?!\/)([^"\x27]*)/g, (_, p1, rest) => p1 + rewriteMatch(rest))
              // The one non-HTML-attribute case: Mermaid `click Id "/slug" "tip"`
              // directives are HTML-escaped (&quot;) inside a <pre><code> block.
              .replace(/(click [a-zA-Z0-9_]+ &quot;)\/(?!\/)([^&]*)/g, (_, p1, rest) => p1 + rewriteMatch(rest))
            if (after !== before) fs.writeFileSync(file, after);
          }
          walk(root);
          console.log("Rewrote root-absolute asset paths under " + root);
          EOF
          node /tmp/rewrite-paths.cjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .brain-site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
