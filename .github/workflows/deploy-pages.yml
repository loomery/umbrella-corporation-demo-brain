# Builds the brain-site static frontend and deploys it to GitHub Pages.
#
# This is the public-facing demo site for this project brain — a Quartz-based wiki
# and dashboard rendered from docs/*.md via the @loomery/brain-site package.

name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to loomery/brain-site over HTTPS
        # npm's `github:owner/repo` shorthand shells out to `git ls-remote` over
        # SSH by default, and this runner has no SSH key. Rewrite ssh:// to an
        # authenticated https:// URL instead — works whether brain-site is
        # public (the token is just unused then) or private (the token is
        # required). BRAIN_SITE_TOKEN is a personal access token with read
        # access to loomery/brain-site; the default GITHUB_TOKEN can't reach
        # other private repos in the org.
        run: |
          git config --global url."https://x-access-token:${{ secrets.BRAIN_SITE_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npx brain-site build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .brain-site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
